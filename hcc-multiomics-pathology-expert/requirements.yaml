# Single source of truth for the Expert runtime. Version ranges preserve compatibility
# with a platform's existing environment while preventing known-incompatible major releases.
schema_version: 1
python: ">=3.10,<3.14"

profiles:
  core:
    packages:
      - numpy>=1.26,<3
      - pandas>=2.1,<3
      - scipy>=1.11,<2
      - matplotlib>=3.7,<4
      - h5py>=3.10,<4
      - packaging>=23,<27

  spatial_bulk:
    packages:
      - anndata>=0.10,<1
      - scanpy>=1.10,<2
      - scikit-image>=0.22,<1
      - statsmodels>=0.14,<1

  pathology:
    packages:
      - Pillow>=10,<12
      - openslide-python>=1.3,<2

system_requirements:
  pathology:
    - OpenSlide shared library is required for SVS, NDPI, MRXS, and SCN files.

install_policy:
  isolated_environment_required: true
  never_install_into_system_python: true
  missing_dependency_behavior: request_confirmation_then_install_in_isolated_environment_or_disable
